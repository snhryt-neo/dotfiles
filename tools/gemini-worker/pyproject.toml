[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-worker"
version = "0.1.0"
description = "A constrained Vertex AI Gemini worker for Codex-orchestrated tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai==2.24.0",
  "google-auth>=2.47,<3",
  "pydantic>=2.12,<3",
]

[project.scripts]
gemini-worker = "gemini_worker.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
